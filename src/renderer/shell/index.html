<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>FPV Sim</title>
<link rel="stylesheet" href="../shared/app.css">
<style>
  body { padding: 28px 32px; gap: 20px; }
  header h1 { font-size: 20px; }
  header p { color: var(--dim); margin-top: 4px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 16px;
    text-align: left;
    color: var(--ink);
    letter-spacing: 0;
    cursor: pointer;
  }
  .card:hover { background: var(--panel); color: var(--ink); border-color: var(--accent-dim); }
  .card b { display: block; color: var(--accent); letter-spacing: 1px; margin-bottom: 6px; }
  .card span { color: var(--dim); font-size: 12.5px; }
  .launch {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .launch label { font-size: 12.5px; }
  .launch input[type="number"] { width: 130px; }
  .launch button { padding: 7px 16px; }
  footer { margin-top: auto; color: var(--dim); font-size: 11.5px; line-height: 1.7; }
  footer code { color: var(--ink); }
</style>
</head>
<body>
  <header>
    <h1>FPV SIM</h1>
    <p>FPV sUAS vs counter-UAS engagement — sim, evidence, interoperability. Notional data only.</p>
  </header>

  <div class="cards">
    <button class="card" id="open-sim">
      <b>SIMULATION</b>
      <span>The interactive engagement — orbit and tactical modes, featured scenarios, event log.</span>
    </button>
    <button class="card" id="open-dashboard">
      <b>DASHBOARD</b>
      <span>Monte Carlo results: baseline, paired experiments, dose-response, ad-hoc sweeps.</span>
    </button>
    <button class="card" id="open-viewer3d">
      <b>3D VIEWER</b>
      <span>WebGPU terrain, canopy, flight paths and the detectability field.</span>
    </button>
    <button class="card" id="open-studies">
      <b>STUDIES</b>
      <span>Run the canonical Monte Carlo study or ad-hoc sweeps against the bundled engine.</span>
    </button>
    <button class="card" id="open-mcp">
      <b>MCP ENDPOINT</b>
      <span>Connect Claude Code and other MCP clients to the batch and live tools.</span>
    </button>
    <button class="card" id="open-live">
      <b>LIVE OPS</b>
      <span>Real-time-paced sessions: map, entities, events — the DIS gateway's feed.</span>
    </button>
  </div>

  <div class="launch">
    <label for="seed">SEED</label>
    <input id="seed" type="number" min="0" max="4294967295" step="1" value="20260719">
    <label for="mode">MODE</label>
    <select id="mode">
      <option value="orbit" selected>orbit</option>
      <option value="tactical">tactical</option>
    </select>
    <label><input id="play" type="checkbox" checked> autoplay</label>
    <button id="launch">LAUNCH</button>
  </div>

  <footer id="footer">loading version info…</footer>

<script src="../shared/app.js"></script>
<script>
  const $ = app.$;
  $("open-sim").addEventListener("click", () => window.fpvApp.openWindow("sim"));
  $("open-dashboard").addEventListener("click", () => window.fpvApp.openWindow("dashboard"));
  $("open-viewer3d").addEventListener("click", () => window.fpvApp.openWindow("viewer3d"));
  $("open-studies").addEventListener("click", () => window.fpvApp.openPanel("studies"));
  $("open-mcp").addEventListener("click", () => window.fpvApp.openPanel("mcp"));
  $("open-live").addEventListener("click", () => window.fpvApp.openPanel("live-ops"));
  $("launch").addEventListener("click", () => {
    const seed = Number($("seed").value);
    window.fpvApp.openWindow("sim", {
      seed: Number.isFinite(seed) ? seed : undefined,
      mode: $("mode").value,
      play: $("play").checked,
    });
  });

  // Last-used launch settings come back on the next open.
  app.remember("shell", {
    seed: { el: "seed", type: "int" },
    mode: { el: "mode" },
    play: { el: "play", type: "bool" },
  });

  window.fpvApp.info().then((i) => {
    const pin = i.pins && i.pins.fpv_sim_commit ? i.pins.fpv_sim_commit.slice(0, 7) : "unvendored";
    $("footer").innerHTML =
      "app <code>" + i.appVersion + "</code> · engine fpv-sim-mcp <code>" + i.engineVersion + "</code>" +
      " · ui pin <code>" + pin + "</code> · electron <code>" + i.electron + "</code>" +
      " · node <code>" + i.node + "</code> · chrome <code>" + i.chrome + "</code>";
  }).catch(() => { $("footer").textContent = "version info unavailable"; });
</script>
</body>
</html>
