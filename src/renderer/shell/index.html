<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>FPV Sim</title>
<link rel="stylesheet" href="../shared/app.css">
<style>
  body { padding: 28px 32px; gap: 18px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  header h1 { font-size: 20px; }
  header p { color: var(--dim); margin-top: 4px; }
  header button.quiet { flex: none; margin-top: 4px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 16px;
    text-align: left;
    color: var(--ink);
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); color: var(--ink); }
  .card b { display: block; color: var(--bright); letter-spacing: .12em; margin-bottom: 6px; }
  .card:hover b { color: var(--accent); }
  .card span { color: var(--dim); font-size: 12.5px; }
  .launch {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .launch label { font-size: 12.5px; }
  .launch input[type="number"] { width: 130px; }
  .launch button { padding: 7px 16px; }
  .launch button.quiet { padding: 4px 10px; }
  /* What the three services are doing right now; each cell opens its panel. */
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .strip button {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 8px 12px;
    text-align: left; letter-spacing: 0; text-transform: none; color: var(--ink);
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .strip button:hover { border-color: var(--edge-hi); color: var(--ink); }
  .strip b { font-size: 10.5px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .strip span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The version line fits beside COPY at the default width; narrower
     than that it wraps. */
  footer {
    margin-top: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    color: var(--dim); font-size: 11px; line-height: 1.7;
  }
  footer #version { flex: 1; min-width: 240px; }
  footer button.quiet { padding: 2px 8px; font-size: 10.5px; }
  footer code { color: var(--ink); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>FPV SIM</h1>
      <p>FPV sUAS vs counter-UAS engagement — sim, evidence, interoperability. Notional data only.</p>
    </div>
    <button type="button" id="open-manual" class="quiet" title="Open the user manual (F1)">MANUAL</button>
  </header>

  <div class="cards">
    <button class="card" id="open-sim" title="Ctrl+1">
      <b>SIMULATION</b>
      <span>The interactive engagement — orbit and tactical modes, featured scenarios, event log.</span>
    </button>
    <button class="card" id="open-dashboard" title="Ctrl+2">
      <b>DASHBOARD</b>
      <span>Monte Carlo results: baseline, paired experiments, dose-response, ad-hoc sweeps.</span>
    </button>
    <button class="card" id="open-viewer3d" title="Ctrl+3">
      <b>3D VIEWER</b>
      <span>WebGPU terrain, canopy, flight paths and the detectability field.</span>
    </button>
    <button class="card" id="open-studies" title="Ctrl+4">
      <b>STUDIES</b>
      <span>Run the canonical Monte Carlo study or ad-hoc sweeps against the bundled engine.</span>
    </button>
    <button class="card" id="open-mcp" title="Ctrl+5">
      <b>MCP ENDPOINT</b>
      <span>Connect Claude Code and other MCP clients to the batch and live tools.</span>
    </button>
    <button class="card" id="open-live" title="Ctrl+6">
      <b>LIVE OPS</b>
      <span>Real-time-paced sessions: map, entities, events — the DIS gateway's feed.</span>
    </button>
  </div>

  <form class="launch" id="launch-form">
    <label for="seed">SEED</label>
    <input id="seed" type="number" min="0" max="4294967295" step="1" value="20260719" required>
    <button type="button" id="seed-random" class="quiet" title="Pick a random seed">RANDOM</button>
    <label for="mode">MODE</label>
    <select id="mode">
      <option value="orbit" selected>orbit</option>
      <option value="tactical">tactical</option>
    </select>
    <label><input id="play" type="checkbox" checked> autoplay</label>
    <button type="submit" id="launch" class="primary" title="Open the Simulation at this seed and mode (Enter)">LAUNCH</button>
  </form>

  <div class="strip" id="strip">
    <button type="button" id="st-studies" title="Open the Studies panel"><b>Studies</b><span id="st-studies-text">…</span></button>
    <button type="button" id="st-live" title="Open the Live Ops panel"><b>Live Ops</b><span id="st-live-text">…</span></button>
    <button type="button" id="st-mcp" title="Open the MCP Endpoint panel"><b>MCP endpoint</b><span id="st-mcp-text">…</span></button>
  </div>

  <footer id="footer">
    <span id="version">loading version info…</span>
    <button type="button" id="copy-version" class="quiet" title="Copy the version line for a bug report">COPY</button>
  </footer>

<script src="../shared/app.js"></script>
<script>
  const $ = app.$;
  $("open-sim").addEventListener("click", () => window.fpvApp.openWindow("sim"));
  $("open-dashboard").addEventListener("click", () => window.fpvApp.openWindow("dashboard"));
  $("open-viewer3d").addEventListener("click", () => window.fpvApp.openWindow("viewer3d"));
  $("open-studies").addEventListener("click", () => window.fpvApp.openPanel("studies"));
  $("open-mcp").addEventListener("click", () => window.fpvApp.openPanel("mcp"));
  $("open-live").addEventListener("click", () => window.fpvApp.openPanel("live-ops"));

  // Enter in the seed field launches too: the launch bar is a form.
  $("launch-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const seed = Number($("seed").value);
    window.fpvApp.openWindow("sim", {
      seed: Number.isFinite(seed) ? seed : undefined,
      mode: $("mode").value,
      play: $("play").checked,
    });
  });
  $("seed-random").addEventListener("click", () => {
    $("seed").value = String(crypto.getRandomValues(new Uint32Array(1))[0]);
    $("seed").dispatchEvent(new Event("input", { bubbles: true })); // remembered like a typed seed
    $("seed").focus();
  });

  // Last-used launch settings come back on the next open.
  app.remember("shell", {
    seed: { el: "seed", type: "int" },
    mode: { el: "mode" },
    play: { el: "play", type: "bool" },
  });

  /* ---------------- status strip ----------------
   * Main formats the three lines; this page paints them and decides how
   * often to ask: every second while something runs (the elapsed time and
   * sim clock tick), every five seconds otherwise, and at once when a
   * broadcast says something changed. Only while the window is visible. */
  const CELLS = { studies: "st-studies-text", live: "st-live-text", mcp: "st-mcp-text" };
  let busy = false, tick = 0, lastRefreshAt = 0;
  async function refreshStrip() {
    lastRefreshAt = Date.now();
    try {
      const s = await window.fpvApp.status();
      for (const [k, id] of Object.entries(CELLS)) app.setLine($(id), s[k].text, s[k].cls);
      busy = s.busy;
    } catch (err) {
      for (const id of Object.values(CELLS)) app.setLine($(id), "status unavailable", "bad");
    }
  }
  const refreshSoon = () => { if (Date.now() - lastRefreshAt > 900) refreshStrip(); };
  setInterval(() => {
    tick++;
    if (document.visibilityState !== "visible") return;
    if (busy || tick % 5 === 0) refreshStrip();
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshStrip(); });
  window.fpvApp.studies.onOutput(refreshSoon);
  window.fpvApp.studies.onDone(() => refreshStrip());
  window.fpvApp.live.onSnapshot(refreshSoon);
  window.fpvApp.live.onEnded(() => refreshStrip());
  $("st-studies").addEventListener("click", () => window.fpvApp.openPanel("studies"));
  $("st-live").addEventListener("click", () => window.fpvApp.openPanel("live-ops"));
  $("st-mcp").addEventListener("click", () => window.fpvApp.openPanel("mcp"));
  refreshStrip();

  /* ---------------- footer ---------------- */
  let versionText = "";
  window.fpvApp.info().then((i) => {
    versionText = i.versionLine;
    // "key value · key value …" — highlight each value, keep the text identical to the copied line.
    $("version").innerHTML = i.versionLine.split(" · ").map((part) => {
      const at = part.lastIndexOf(" ");
      const key = document.createElement("span"); key.textContent = part.slice(0, at) + " ";
      const val = document.createElement("code"); val.textContent = part.slice(at + 1);
      return key.outerHTML + val.outerHTML;
    }).join(" · ");
  }).catch(() => { $("version").textContent = "version info unavailable"; });
  app.copyButton($("copy-version"), () => versionText || $("version").textContent);
  $("open-manual").addEventListener("click", () => window.fpvApp.openHelp("manual"));
</script>
</body>
</html>
