<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Studies</title>
<style>
  :root {
    --bg: #10140f; --panel: #171d15; --edge: #2a3325; --ink: #cdd6c4;
    --dim: #7d8a72; --accent: #a7d129; --accent-dim: #5d7a1a; --err: #d16a4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13.5px/1.5 "Cascadia Mono", Consolas, monospace;
    min-height: 100vh; display: flex; flex-direction: column; padding: 22px 26px; gap: 14px;
  }
  h1 { font-size: 17px; letter-spacing: 2px; color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .box { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 12px 14px; }
  .box h2 { font-size: 12px; letter-spacing: 1px; color: var(--dim); margin-bottom: 8px; }
  label { color: var(--dim); font-size: 12px; }
  input, select, textarea {
    background: var(--bg); color: var(--ink); border: 1px solid var(--edge);
    border-radius: 4px; padding: 5px 8px; font: inherit;
  }
  input[type="number"] { width: 110px; }
  textarea { width: 100%; height: 52px; resize: vertical; }
  button {
    background: var(--accent-dim); color: #eaf5d0; border: none; border-radius: 4px;
    padding: 6px 14px; font: inherit; letter-spacing: 1px; cursor: pointer;
  }
  button:hover { background: var(--accent); color: #1c2410; }
  button.warn { background: #6b3a2a; }
  button.warn:hover { background: var(--err); color: #1c0f08; }
  button:disabled { opacity: 0.45; cursor: default; }
  #status { color: var(--dim); }
  #status.running { color: var(--accent); }
  progress { width: 240px; accent-color: var(--accent); }
  #log {
    flex: 1; background: #0b0e0a; border: 1px solid var(--edge); border-radius: 6px;
    padding: 10px 12px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; min-height: 200px;
  }
  #log .stderr { color: var(--dim); }
  #log .sys { color: var(--accent); }
  .note { color: var(--dim); font-size: 11.5px; }
</style>
</head>
<body>
  <h1>STUDIES</h1>

  <div class="box">
    <h2>CANONICAL MONTE CARLO STUDY</h2>
    <div class="row">
      <label>mode</label>
      <select id="study-mode"><option value="orbit" selected>orbit</option><option value="tactical">tactical</option></select>
      <button id="study-quick">RUN QUICK (~4 min)</button>
      <button id="study-full">RUN FULL (~25 min)</button>
      <span class="note">the exact scripts and experiments the published datasets come from</span>
    </div>
  </div>

  <div class="box">
    <h2>AD-HOC SWEEP</h2>
    <div class="row" style="margin-bottom:8px">
      <label>label</label><input id="sw-label" type="text" size="26" placeholder="DF bearing error doubled">
      <label>start</label><input id="sw-start" type="number" value="1" min="0">
      <label>count</label><input id="sw-count" type="number" value="1000" min="1">
      <label>mode</label>
      <select id="sw-mode"><option value="orbit" selected>orbit</option><option value="tactical">tactical</option></select>
    </div>
    <div class="row" style="margin-bottom:8px">
      <label style="align-self:flex-start">overrides&nbsp;JSON</label>
      <textarea id="sw-overrides" placeholder='{"CUAS":{"BRG_SIGMA_DEG":8}}'></textarea>
    </div>
    <div class="row">
      <button id="sw-run">RUN PARALLEL</button>
      <button id="sw-run-canonical">RUN SINGLE-THREADED</button>
      <span class="note">parallel uses a worker pool; single-threaded is the byte-canonical run-sweep.mjs</span>
    </div>
  </div>

  <div class="row">
    <span id="status">idle</span>
    <progress id="progress" max="100" value="0" hidden></progress>
    <button id="cancel" class="warn" disabled>CANCEL</button>
    <button id="open-dashboard">OPEN DASHBOARD</button>
  </div>

  <div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  const status = $("status");
  const progress = $("progress");
  const cancelBtn = $("cancel");
  const buttons = ["study-quick", "study-full", "sw-run", "sw-run-canonical"].map($);

  function setRunning(running, descr) {
    buttons.forEach((b) => (b.disabled = running));
    cancelBtn.disabled = !running;
    status.textContent = running ? `running: ${descr ?? ""}` : "idle";
    status.className = running ? "running" : "";
    if (!running) progress.hidden = true;
  }

  function append(cls, line) {
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = line;
    log.appendChild(div);
    while (log.childNodes.length > 800) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  window.fpvApp.studies.onOutput(({ stream, line }) => {
    if (stream === "stdout") {
      try {
        const msg = JSON.parse(line);
        if (msg.type === "progress") {
          progress.hidden = false;
          progress.max = msg.total;
          progress.value = msg.done;
          return;
        }
        if (msg.type === "done") {
          append("sys", `dataset ${msg.file} — ${msg.runs} runs, B ${msg.outcomes.BLUFOR} / O ${msg.outcomes.OPFOR} / S ${msg.outcomes.STALEMATE}`);
          return;
        }
      } catch { /* plain line */ }
    }
    append(stream === "stderr" ? "stderr" : stream === "sys" ? "sys" : "", line);
  });
  window.fpvApp.studies.onDone(({ code, descr }) => {
    append("sys", `${descr} finished with exit code ${code}`);
    setRunning(false);
  });

  async function start(opts) {
    const r = await window.fpvApp.studies.start(opts);
    if (!r.ok) { append("sys", `refused: ${r.error}`); return; }
    setRunning(true, describe(opts));
  }
  const describe = (o) =>
    o.kind === "study" ? `${o.quick ? "quick" : "full"} study (${o.mode})` : `${o.kind} "${o.label}" (${o.mode})`;

  $("study-quick").addEventListener("click", () => start({ kind: "study", quick: true, mode: $("study-mode").value }));
  $("study-full").addEventListener("click", () => start({ kind: "study", quick: false, mode: $("study-mode").value }));
  const sweepOpts = (kind) => ({
    kind,
    label: $("sw-label").value,
    start: Number($("sw-start").value),
    count: Number($("sw-count").value),
    mode: $("sw-mode").value,
    overrides: $("sw-overrides").value.trim() || undefined,
  });
  $("sw-run").addEventListener("click", () => start(sweepOpts("adhoc")));
  $("sw-run-canonical").addEventListener("click", () => start(sweepOpts("sweep")));
  $("cancel").addEventListener("click", () => window.fpvApp.studies.cancel());
  $("open-dashboard").addEventListener("click", () => window.fpvApp.openWindow("dashboard"));

  window.fpvApp.studies.status().then((s) => setRunning(s.running, s.descr));
</script>
</body>
</html>
