# Build + verify on every change, plus a weekly cron that doubles as the
# "upstreams moved" alarm (the parity smoke runs against the *pinned*
# dependency, so a red weekly run means this repo's environment broke —
# upstream drift itself is caught by the pin-pair check when pins bump).
#
# Gates, in order:
#   1. npm ci            — git-dep engine builds via its prepare script
#   2. vendor + build    — UI snapshot from the submodule; tsc
#   3. check-pins        — fixtures' source commit .. submodule pin leaves
#                          index.html unchanged (the parity-pair invariant)
#   4. npm test          — engine-parity smoke (11 golden runs, both modes,
#                          event strings byte-equal) + ad-hoc runner
#                          equivalence vs run-sweep.mjs
#   5. interop-check     — the DIS stream scored by open-dis-python (an
#                          INDEPENDENT IEEE 1278.1 implementation, pinned
#                          by commit), both directions over UDP loopback
#   6. electron --self-check — app-level smoke: app:// serving, engine
#                          under a deep link, dashboard data, viewer3d
#   7. screenshots + manual — every committed manual figure regenerates
#                          from the app (viewer3d excepted: no GPU on the
#                          runner) and the PDF builds
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run check-pins
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PyPI's opendis 1.0 pins numpy<2 (no py3.13 build); the pinned
      # upstream commit needs no numpy. Bump deliberately, never float.
      - run: python -m pip install "git+https://github.com/open-dis/open-dis-python@732b6655bb47e34ccc73722eefe0f4706fd0032f"
      - run: npm run interop-check
      - run: npx electron . --self-check
      - run: npx electron . --screenshots="${{ runner.temp }}\shots" --skip=viewer3d
      - run: node scripts/check-screenshots.mjs "${{ runner.temp }}\shots\manifest.json" docs/manual/images/manifest.json --ignore-group=viewer3d
      - run: npm run manual:pdf
