# Release: build the NSIS installer on a version tag and attach it to
# the GitHub release. Unsigned unless the org drops a cert into
# CSC_LINK/CSC_KEY_PASSWORD secrets (electron-builder picks them up).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run check-pins
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: out/fpv-sim-app-setup-*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-Item out/fpv-sim-app-setup-*.exe).FullName --clobber
