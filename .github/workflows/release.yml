# Release: build the NSIS installer and the user-manual PDF on a version
# tag and attach both to the GitHub release. Unsigned unless the org drops a cert into
# CSC_LINK/CSC_KEY_PASSWORD secrets (electron-builder picks them up).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build
      - run: npm run check-pins
      - run: npm test
      - run: npm run manual:pdf
      - run: npx electron-builder --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: out/fpv-sim-app-setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: docs/manual/fpv-sim-manual.pdf
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # A tag push creates the tag, not a Release; `gh release upload` needs
          # the Release to exist already, so create it on first run.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "gh release create $tag failed" }
          }
          gh release upload $tag (Get-Item out/fpv-sim-app-setup-*.exe).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "installer upload failed" }
          gh release upload $tag docs/manual/fpv-sim-manual.pdf --clobber
          if ($LASTEXITCODE -ne 0) { throw "manual upload failed" }
